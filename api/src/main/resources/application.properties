#Cover image storage - must point to the same folder the dataload module writes to
cover.storage.path=E:/AlbumCovers

#Artist photo storage - must point to the same folder the dataload module writes to
artist.photo.storage.path=E:/ArtistPhotos

#User profile photo storage
user.photo.storage.path=E:/UserPhotos

#Profile photo upload limits
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

#Database
spring.datasource.url=
spring.datasource.username=
spring.datasource.password=
spring.datasource.driver-class-name=org.postgresql.Driver

#JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
#OSIV filter disabled
spring.jpa.open-in-view=false

#Logging
logging.level.root=INFO
logging.level.org.soundtrack=DEBUG

#Server
server.port=8080

#JWTSECRET
jwt.secret=
#Access token lifetime: 15 minutes
jwt.expiration=900000
#Refresh token lifetime: 30 days
jwt.refresh-expiration=2592000000

#Auth cookies - set to true once served over HTTPS
security.cookie.secure=false