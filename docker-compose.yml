services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      COVER_STORAGE_PATH: /data/covers
      ARTIST_PHOTO_STORAGE_PATH: /data/artist-photos
      USER_PHOTO_STORAGE_PATH: /data/user-photos
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME:-}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD:-}
      APP_MAIL_FROM: ${APP_MAIL_FROM:-}
      APP_MAIL_SUPPORT_TO: ${APP_MAIL_SUPPORT_TO:-}
    volumes:
      - covers:/data/covers
      - artist_photos:/data/artist-photos
      - user_photos:/data/user-photos
    ports:
      - "8080:8080"

  ui:
    build:
      context: ./ui
    depends_on:
      - api
    ports:
      - "5173:80"

volumes:
  pgdata:
  covers:
  artist_photos:
  user_photos:
